<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(title='My Saved Jobs')}">
</head>
<body class="bg-light">
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col">
                <h2 class="display-6 fw-bold text-dark">
                    <i class="bi bi-heart-fill text-danger me-2"></i>My Saved Jobs
                </h2>
                <p class="text-muted">Review the positions you've saved for later.</p>
            </div>
        </div>

        <div class="row g-4" th:if="${not #lists.isEmpty(savedJobs)}">
            <div class="col-md-6 col-lg-4" th:each="job : ${savedJobs}">
                <div class="card h-100 shadow-sm border-0 rounded-3" style="transition: transform 0.2s;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-2" th:text="${job.category}">Category</span>
                            <form th:action="@{/teacher/unsave-job}" method="post">
                                <input type="hidden" name="jobId" th:value="${job.id}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm rounded-circle shadow-sm" title="Remove from Saved">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </form>
                        </div>
                        <h5 class="card-title fw-bold mb-2 h4 text-dark" th:text="${job.title}">Job Title</h5>
                        <p class="card-subtitle mb-3 text-secondary h6">
                            <i class="bi bi-building me-1"></i>
                            <span th:text="${job.company}">Company Name</span>
                        </p>
                        <div class="d-flex align-items-center mb-3 text-muted small">
                            <span class="me-3">
                                <i class="bi bi-geo-alt me-1"></i>
                                <span th:text="${job.location}">Location</span>
                            </span>
                            <span>
                                <i class="bi bi-calendar3 me-1"></i>
                                <span th:text="${job.postedDate}">Date</span>
                            </span>
                        </div>
                        <p class="card-text text-secondary mb-4" th:text="${#strings.abbreviate(job.description, 120)}">Short description...</p>
                    </div>
                    <div class="card-footer bg-transparent border-0 pt-0 pb-4 px-4">
                        <a th:href="@{/jobs/{id}(id=${job.id})}" class="btn btn-primary w-100 rounded-pill shadow-sm py-2 fw-semibold">
                            View Details <i class="bi bi-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="row mt-5" th:if="${#lists.isEmpty(savedJobs)}">
            <div class="col text-center">
                <div class="p-5 bg-white rounded-4 shadow-sm border border-dashed py-5">
                    <i class="bi bi-heart-break display-1 text-muted opacity-25 mb-4 d-block"></i>
                    <h3 class="fw-bold text-dark">No saved jobs yet</h3>
                    <p class="text-secondary mb-4">Jobs you save will appear here for easy access.</p>
                    <a th:href="@{/jobs}" class="btn btn-primary btn-lg px-4 rounded-pill shadow">
                        Browse Jobs <i class="bi bi-search ms-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    
    <style>
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
        }
    </style>
</body>
</html>
