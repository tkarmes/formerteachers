spring.application.name=FormerTeachers
spring.datasource.url=jdbc:postgresql://localhost:5432/formerteachersdb
spring.datasource.username=postgres
spring.datasource.password=postgres1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always

# Multipart Upload Settings - Increased to 10MB for modern high-res photos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Forces Tomcat to continue reading the request even if it exceeds the limit, 
# allowing our GlobalExceptionHandler to catch it and show a nice error page 
# instead of a "Connection Reset" browser error.
server.tomcat.max-swallow-size=-1

logging.level.com.formerteachers=DEBUG

