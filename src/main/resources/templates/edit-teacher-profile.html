<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Edit My Profile - FormerTeachers')}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white py-3">
                    <h2 class="h4 mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Your Teacher Profile</h2>
                </div>
                <div class="card-body p-4">

                    <!-- Error Alert Section -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/teacher/profile/update}" th:object="${teacher}" method="post" enctype="multipart/form-data" id="profileForm">
                        <input type="hidden" th:field="*{id}" />
                        <input type="hidden" th:field="*{profileImageUrl}" />
                        <input type="hidden" th:field="*{resumeUrl}" />

                        <!-- Photo Section -->
                        <div class="text-center mb-4">
                            <div class="mb-3">
                                <img th:if="${teacher.profileImageUrl != null && !teacher.profileImageUrl.empty}"
                                     th:src="${teacher.profileImageUrl}"
                                     class="rounded-circle shadow-sm profile-preview"
                                     id="imagePreview"
                                     style="width: 150px; height: 150px; object-fit: cover;">

                                <img th:if="${teacher.profileImageUrl == null || teacher.profileImageUrl.empty}"
                                     th:src="'https://api.dicebear.com/7.x/initials/svg?seed=' + ${teacher.fullName}"
                                     class="rounded-circle shadow-sm profile-preview"
                                     id="imagePreview"
                                     style="width: 150px; height: 150px; object-fit: cover;">
                            </div>
                            <div class="mb-3">
                                <label for="profileImage" class="btn btn-outline-primary btn-sm">
                                    <i class="bi bi-camera me-1"></i> Upload New Photo
                                    <input type="file" id="profileImage" name="profileImage" accept="image/*" class="d-none">
                                </label>
                                <div class="text-muted small mt-1">Recommended: Square image, max 10MB</div>
                                <div id="fileSizeError" class="text-danger small mt-1 d-none">
                                    <i class="bi bi-exclamation-circle me-1"></i> File is too large. Max 10MB allowed.
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="row g-3">
                            <div class="col-md-12">
                                <label for="fullName" class="form-label">Full Name</label>
                                <input type="text" class="form-label form-control" id="fullName" th:field="*{fullName}" required>
                            </div>

                            <!-- Visibility Toggle -->
                            <div class="col-md-12">
                                <div class="form-check form-switch p-3 bg-light rounded border">
                                    <input class="form-check-input ms-0" type="checkbox" role="switch" id="publicProfile" th:field="*{publicProfile}">
                                    <label class="form-check-label ms-2 fw-bold" for="publicProfile">
                                        Make Profile Publicly Searchable for Employers
                                    </label>
                                    <div class="small text-muted ms-2 mt-1">When enabled, employers can find you in the Talent Gallery.</div>
                                </div>
                            </div>

                            <!-- Resume Upload Section -->
                            <div class="col-md-12">
                                <label for="resume" class="form-label">Resume (PDF, DOC, DOCX)</label>
                                <div class="input-group">
                                    <input type="file" class="form-control" id="resume" name="resume" accept=".pdf,.doc,.docx">
                                </div>
                                <div th:if="${teacher.resumeUrl != null}" class="mt-2">
                                    <span class="badge bg-success"><i class="bi bi-check-circle me-1"></i> Resume already uploaded</span>
                                    <a th:href="${teacher.resumeUrl}" target="_blank" class="ms-2 small">View current resume</a>
                                </div>
                                <div class="text-muted small mt-1">Max file size: 10MB.</div>
                            </div>

                            <div class="col-md-6">
                                <label for="subjectSpecialty" class="form-label">Subject Specialty</label>
                                <input type="text" class="form-control" id="subjectSpecialty" th:field="*{subjectSpecialty}" placeholder="e.g. 5th Grade, High School Math">
                            </div>

                            <div class="col-md-6">
                                <label for="yearsInClassroom" class="form-label">Years in Classroom</label>
                                <input type="number" class="form-control" id="yearsInClassroom" th:field="*{yearsInClassroom}" min="0">
                            </div>

                            <div class="col-md-12">
                                <label for="desiredRole" class="form-label">Desired Corporate Role</label>
                                <input type="text" class="form-control" id="desiredRole" th:field="*{desiredRole}" placeholder="e.g. Instructional Designer, Project Manager">
                            </div>

                            <div class="col-md-12">
                                <label for="bio" class="form-label">Your Transition Story (Bio)</label>
                                <textarea class="form-control" id="bio" th:field="*{bio}" rows="6"
                                          placeholder="Tell employers how your classroom skills (patience, organization, curriculum design) make you an asset to their team..."></textarea>
                            </div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                            <a th:href="@{/teacher/profile}" class="btn btn-light border px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary px-5" id="saveBtn">Save Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>

<script>
    // Live preview of the uploaded image
    document.getElementById('profileImage').addEventListener('change', function(event) {
        const file = event.target.files[0];
        const preview = document.getElementById('imagePreview');
        const errorDiv = document.getElementById('fileSizeError');
        const saveBtn = document.getElementById('saveBtn');

        if (file) {
            // Check file size (10MB = 10 * 1024 * 1024 bytes)
            const maxSize = 10 * 1024 * 1024;

            if (file.size > maxSize) {
                errorDiv.classList.remove('d-none');
                saveBtn.disabled = true;
                return;
            } else {
                errorDiv.classList.add('d-none');
                saveBtn.disabled = false;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    });
</script>

</body>
</html>
