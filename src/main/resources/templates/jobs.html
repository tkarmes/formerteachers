<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(title='Browse Jobs')}"></head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main style="flex: 1; padding: 40px 0; background-color: #f8fafc;">
    <div class="container">
        <!-- Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Modern Header -->
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold text-dark mb-3">Find Your Next Role</h1>
            <p class="lead text-muted fs-4" style="max-width: 720px; margin: 0 auto;">
                Opportunities for educators pivoting into EdTech, corporate training, L&amp;D, and beyond.
            </p>
        </div>

        <!-- Search Bar -->
        <div class="shadow-sm p-4 bg-white rounded-3 mb-5" style="border: 1px solid #e2e8f0;">
            <form action="/jobs/search" method="get" class="row g-3">
                <div class="col-md-10">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Job title, company, or location...">
                    </div>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100 h-100">Search</button>
                </div>
            </form>
        </div>

        <!-- Job Count -->
        <div th:if="${jobs != null && !#lists.isEmpty(jobs)}" class="mb-4">
            <strong th:text="${#lists.size(jobs)}">0</strong> opportunities found
        </div>

        <!-- Improved Modern Job Cards -->
        <div class="row" th:if="${jobs != null && not #lists.isEmpty(jobs)}">
            <div th:each="job : ${jobs}" class="col-md-6 col-lg-4 mb-4">
                <div class="job-card h-100"
                     style="background: white; border-radius: 16px; border: 1px solid #e2e8f0;
                            box-shadow: 0 4px 15px rgba(0,0,0,0.06); overflow: hidden;
                            transition: all 0.3s ease; cursor: pointer;"
                     th:onclick="|window.location.href='/jobs/${job.id}'|">

                    <div class="p-4 pb-3" style="flex: 1;">
                        <h4 class="fw-bold mb-2" th:text="${job.title}" style="font-size: 1.35rem; line-height: 1.3;"></h4>
                        <p class="text-primary fw-medium mb-3" th:text="${job.employer != null ? job.employer.companyName : job.company}"></p>

                        <div class="d-flex flex-wrap gap-2 mb-4">
                            <span class="badge bg-light text-dark px-3 py-2" th:text="${job.location}"></span>
                            <span class="badge bg-light text-dark px-3 py-2" th:text="${job.workType}"></span>
                            <span th:if="${job.salaryRange}" class="badge bg-light text-dark px-3 py-2" th:text="${job.salaryRange}"></span>
                        </div>

                        <p class="text-muted mb-4" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.55;"
                           th:text="${job.description}"></p>
                    </div>

                    <div class="px-4 py-3 border-top bg-light d-flex align-items-center justify-content-between">
                        <small class="text-muted">
                            Posted <span th:text="${job.createdAt != null ? #temporals.format(job.createdAt, 'MMM dd') : 'Recently'}"></span>
                        </small>

                        <a th:href="@{/jobs/{id}(id=${job.id})}"
                           class="btn btn-primary btn-sm px-4">View Details</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- No Jobs -->
        <div th:if="${jobs == null || #lists.isEmpty(jobs)}" class="text-center py-5">
            <p class="fs-5 text-muted">No jobs found matching your search.</p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/common :: footer}"></footer>
<div th:replace="~{fragments/common :: scripts}"></div>

</body>
</html>
