spring.application.name=FormerTeachers

# ================== Database Configuration ==================
# Local development (used only when no env var is set)
spring.datasource.url=jdbc:postgresql://localhost:5432/formerteachersdb
spring.datasource.username=postgres
spring.datasource.password=postgres1

# Production will override these via Render environment variables
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false                    # Set to true only for debugging
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL init - Better to use 'embedded' or 'never' on Render
spring.sql.init.mode=embedded

# ================== Server Configuration ==================
server.port=${SERVER_PORT:8080}

# Multipart upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=-1

# Logging
logging.level.com.formerteachers=DEBUG
logging.level.org.hibernate.SQL=DEBUG        # Only if you need it temporarily