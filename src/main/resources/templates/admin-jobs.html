<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(title='Admin - Manage Jobs')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/common :: navbar}"></nav>

    <div class="container mt-5 pb-5">
        <div class="row mb-4">
            <div class="col-md-6">
                <h2 class="fw-bold">Manage Job Postings</h2>
                <p class="text-muted" th:text="${jobs.size()} + ' total listings in the system'"></p>
            </div>
            <div class="col-md-6 text-md-end">
                <a href="/admin/dashboard" class="btn btn-outline-secondary rounded-pill">
                    <i class="fas fa-arrow-left me-1"></i> Admin Dashboard
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <div class="input-group mb-0">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="adminSearch" class="form-control border-start-0 ps-0" placeholder="Filter by title, company, or category..." onkeyup="filterTable()">
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="jobsTable">
                    <thead class="bg-dark text-white">
                        <tr>
                            <th class="ps-4 py-3">Job Details</th>
                            <th class="py-3">Company</th>
                            <th class="py-3">Status</th>
                            <th class="py-3">Date</th>
                            <th class="text-end pe-4 py-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="job : ${jobs}" th:class="${!job.approved} ? 'table-warning' : ''">
                            <td class="ps-4">
                                <div class="fw-bold text-dark" th:text="${job.title}">Job Title</div>
                                <small class="text-muted" th:text="${job.category}">Category</small>
                            </td>
                            <td th:text="${job.company}">Company</td>
                            <td>
                                <span th:if="${job.approved}" class="badge rounded-pill bg-success-subtle text-success border border-success px-3">
                                    <i class="fas fa-check-circle me-1"></i> Approved
                                </span>
                                <span th:unless="${job.approved}" class="badge rounded-pill bg-warning-subtle text-warning-emphasis border border-warning px-3">
                                    <i class="fas fa-clock me-1"></i> Pending
                                </span>
                            </td>
                            <td class="text-secondary small" th:text="${job.postedDate}">Date</td>
                            <td class="text-end pe-4">
                                <div class="btn-group btn-group-sm">
                                    <form th:if="${!job.approved}" th:action="@{/jobs/admin/jobs/{id}/approve(id=${job.id})}" method="post" class="me-2">
                                        <button type="submit" class="btn btn-success rounded-pill px-3">Approve</button>
                                    </form>
                                    <a th:href="@{/jobs/admin/jobs/{id}/edit(id=${job.id})}" class="btn btn-outline-secondary rounded-start-pill">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/jobs/admin/jobs/{id}/delete(id=${job.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-outline-danger rounded-end-pill" onclick="return confirm('Are you sure?')">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${jobs.isEmpty()}" class="text-center py-5">
                <i class="fas fa-clipboard-list fa-3x text-muted opacity-25 mb-3"></i>
                <h5 class="text-muted">No job postings found.</h5>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/common :: footer}"></footer>
    <div th:replace="~{fragments/common :: scripts}"></div>

    <script>
        function filterTable() {
            const input = document.getElementById("adminSearch").value.toLowerCase();
            const rows = document.querySelectorAll("#jobsTable tbody tr");
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(input) ? "" : "none";
            });
        }
    </script>
</body>
</html>
